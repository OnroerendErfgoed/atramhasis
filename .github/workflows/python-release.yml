# When the draft release x.y.z is published, the sdist and wheel are built and published
# to PyPI with trusted publishing (the publisher on pypi.org names this file and the
# `pypi` environment). The publish job has to be in this file: PyPI doesn't accept
# trusted publishing from a reusable workflow.
name: Python release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    uses: OnroerendErfgoed/shared-workflows/.github/workflows/python-release.yml@v1
    permissions:
      contents: read
    with:
      runs-on: ubuntu-latest
      python-version: "3.11"
      upload: false # the publish job below uploads
      # build_hook.py builds the frontend with pnpm (packageManager in frontend/package.json)
      build-command: |
        corepack enable
        python -m build --outdir "$DIST_DIR" .

  publish:
    needs: build
    # Only releases (tags), not a manual run on a branch.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/atramhasis/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
