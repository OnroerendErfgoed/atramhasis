name: Atramhasis backend tests

on:
  pull_request:
    paths:
      - atramhasis/**
      - scripts/**
      - tests/**
      - '!atramhasis/static/**'
      - .github/workflows/atramhasis_backend.yaml
      - pyproject.toml
      - lockfiles/requirements*.txt

  push:
    branches:
      - master

permissions: {}

jobs:
  test:
    uses: OnroerendErfgoed/shared-workflows/.github/workflows/python-tests.yml@v1
    permissions:
      contents: read
      pull-requests: write # coverage comment
    with:
      runs-on: ubuntu-latest # public repo: no self-hosted runners
      python-versions: '["3.10", "3.11", "3.12", "3.13.10"]'
      # One lockfile per Python version
      install-command: |
        pip install --upgrade "pip<25.3"
        pip install pip-tools
        pip-sync "lockfiles/requirements-dev-py$PYTHON_VERSION.txt"
        pip install -e .
      lint-command: "" # the old workflow ran no linter
      # The frontend isn't built (no build hooks): an empty admin template and the
      # compiled message catalogs are enough for the tests.
      test-command: |
        touch atramhasis/templates/admin.jinja2
        pybabel compile --directory 'atramhasis/locale' --domain atramhasis --statistics true
        pytest tests --exitfirst --capture=no -vvv --full-trace --cov-report xml:"$COVERAGE_XML" --cov=atramhasis
      coverage-source-dir: atramhasis
      coverage-threshold-all: 0.9
