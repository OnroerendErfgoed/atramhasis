# Builds the sdist and wheel and checks them with twine, without uploading.
name: Verify distribution package

on:
  push:
    branches:
      - develop

permissions: {}

jobs:
  twine-check:
    uses: OnroerendErfgoed/shared-workflows/.github/workflows/python-release.yml@v1
    permissions:
      contents: read
    with:
      runs-on: ubuntu-latest
      python-version: "3.11"
      upload: false
      # build_hook.py builds the frontend with pnpm (packageManager in frontend/package.json)
      build-command: |
        corepack enable
        python -m build --outdir "$DIST_DIR" .
